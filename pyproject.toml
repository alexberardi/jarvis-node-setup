[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-node-setup"
version = "0.3.4"
description = "Client software for Jarvis voice nodes"
requires-python = ">=3.10"
dependencies = [
    # >=0.10.0 for image parameters: execute() coerces tool_call image
    # arguments to list[JarvisImage] and to_openai_tool_schema() emits the
    # "x-jarvis-type": "image" marker. (>=0.4.1 was the command-data
    # create-verb used by _op_create.)
    "jarvis-command-sdk>=0.10.0",
]

[tool.setuptools.packages.find]
include = ["commands*", "core*", "clients*", "services*", "utils*", "scripts*"]

[tool.black]
line-length = 79

[tool.pytest.ini_options]
markers = [
    "qa_case(id): map this test to a QA plan case (e.g. CASE-001). The id is exported to JUnit XML for the integration-runner to join against the QA plan.",
]
