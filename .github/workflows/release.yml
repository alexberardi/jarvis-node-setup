name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0-rc1)'
        required: true
      release:
        description: 'Create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            docker_image: python:3.13-slim
            runner: ubuntu-24.04-arm   # native arm64 (free for public repos) — no QEMU

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Checkout jarvis-command-sdk
        uses: actions/checkout@v7
        with:
          repository: alexberardi/jarvis-command-sdk
          path: jarvis-command-sdk

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tarball (native arm64 container)
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/output:/output" \
            ${{ matrix.docker_image }} \
            bash /src/build/build-tarball.sh \
              "${{ steps.version.outputs.version }}" \
              "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-node-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: output/jarvis-node-*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-node-*
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"/*.tar.gz release/
          done
          cp install.sh release/

          cd release
          sha256sum * > checksums.txt

      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # Best-effort: signing must NEVER block a release (phase 1 — no client
          # verifies yet). Any failure warns and the release ships UNSIGNED.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — release will be UNSIGNED"
            exit 0
          fi
          if ! { sudo apt-get update && sudo apt-get install -y minisign; }; then
            echo "::warning::could not install minisign — release will be UNSIGNED"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # minisign reads the password from stdin when not a TTY.
          if printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m release/checksums.txt && [ -f release/checksums.txt.minisig ]; then
            echo "Signed checksums.txt -> checksums.txt.minisig"
          else
            echo "::warning::minisign signing failed — release will be UNSIGNED"
          fi
          shred -u "$key" 2>/dev/null || rm -f "$key"
          exit 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/*
          body: |
            ## Install

            **One-liner (recommended):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            **Manual download:**
            | Platform | Tarball |
            |----------|---------|
            | Pi Zero 2W / Pi 3 / Pi 4 / Pi 5 (arm64) | `jarvis-node-${{ steps.version.outputs.version }}-arm64.tar.gz` |

            After downloading:
            ```bash
            sudo tar xzf jarvis-node-*.tar.gz -C /
            sudo /opt/jarvis-node/install.sh --local
            ```

            **Docker (headless node):**
            ```bash
            docker run -d --name jarvis-node \
              -p 7771:7771 \
              --restart unless-stopped \
              -v jarvis-node-config:/config \
              -v jarvis-node-data:/data \
              -e JARVIS_NODE_DB=/data/jarvis_node.db \
              -e JARVIS_SECRET_DIRECTORY=/data \
              ghcr.io/alexberardi/jarvis-node:latest
            ```
            Then open http://localhost:7771 to set up.

            **Voice node with audio (mic + wake word + speaker):** runs the full
            voice runtime in a container; needs host audio passed in. Image
            `ghcr.io/alexberardi/jarvis-node-audio:${{ steps.version.outputs.version }}`
            (amd64 + arm64). See
            [docs/container-audio.md](https://github.com/${{ github.repository }}/blob/main/docs/container-audio.md).

  # Build each image for each arch on a NATIVE runner (no QEMU), push by
  # digest. Fast enough to run on every push (arm64 wheels install natively).
  build-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: headless, dockerfile: Dockerfile,       repo: ghcr.io/alexberardi/jarvis-node,       runner: ubuntu-latest,    platform: linux/amd64, arch: amd64 }
          - { image: headless, dockerfile: Dockerfile,       repo: ghcr.io/alexberardi/jarvis-node,       runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
          - { image: audio,    dockerfile: Dockerfile.audio, repo: ghcr.io/alexberardi/jarvis-node-audio, runner: ubuntu-latest,    platform: linux/amd64, arch: amd64 }
          - { image: audio,    dockerfile: Dockerfile.audio, repo: ghcr.io/alexberardi/jarvis-node-audio, runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Checkout jarvis-command-sdk
        uses: actions/checkout@v7
        with:
          repository: alexberardi/jarvis-command-sdk
          path: jarvis-command-sdk

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-contexts: |
            jarvis-command-sdk=jarvis-command-sdk
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ matrix.repo }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digest
          echo "${{ steps.build.outputs.digest }}" > /tmp/digest/digest

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digest/digest
          retention-days: 1

  # Merge the per-arch digests into one multi-arch tag per image.
  # v* tags / dispatch-release -> :latest + :version; main -> :edge.
  merge-images:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tags
        id: tags
        run: |
          HEADLESS=ghcr.io/alexberardi/jarvis-node
          AUDIO=ghcr.io/alexberardi/jarvis-node-audio
          VER="${{ steps.version.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.release }}" = "true" ]; then
            echo "headless=$HEADLESS:latest $HEADLESS:$VER" >> "$GITHUB_OUTPUT"
            echo "audio=$AUDIO:latest $AUDIO:$VER" >> "$GITHUB_OUTPUT"
          else
            echo "headless=$HEADLESS:edge" >> "$GITHUB_OUTPUT"
            echo "audio=$AUDIO:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push manifests
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mk() {
            repo="$1"; pat="$2"; shift 2
            refs=""; for f in $pat; do refs="$refs ${repo}@$(cat "$f")"; done
            targs=""; for t in "$@"; do targs="$targs -t $t"; done
            docker buildx imagetools create $targs $refs
            docker buildx imagetools inspect "$1"
          }
          mk ghcr.io/alexberardi/jarvis-node       'digest-headless-*/digest' ${{ steps.tags.outputs.headless }}
          mk ghcr.io/alexberardi/jarvis-node-audio 'digest-audio-*/digest'    ${{ steps.tags.outputs.audio }}
